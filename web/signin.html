<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark"><title>Sign in · LexBharat</title>
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main>
  <h1 class="brand">LexBharat</h1>
  <p class="sub">Sign in to continue.</p>
  <form id="f" novalidate>
    <div id="msg" class="msg" role="alert" aria-live="polite"></div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="go" class="primary" type="submit">Sign in</button>
    <p class="note" style="margin-top:14px"><a id="forgot" href="/forgot-password">Forgot password?</a></p>
  </form>
  <p class="note">New here? <a id="signup" href="/signup">Create an account</a></p>
</main>
<script src="/auth.js"></script>
<script>
(function () {
  var L = window.LB, $ = L.$;
  $("signup").href = "/signup" + L.suffix;
  if (L.qs.get("expired")) L.show("Your session ended. Please sign in again.");
  if (L.qs.get("verified")) L.show("Email confirmed. You can sign in now.", "ok");
  if (L.qs.get("reset")) L.show("Password changed. Sign in with your new password.", "ok");

  $("f").addEventListener("submit", async function (ev) {
    ev.preventDefault(); L.show("");
    var email = $("email").value.trim(), pw = $("pw").value;
    if (!email || !pw) { L.show("Enter your email and password."); return; }
    $("go").disabled = true; $("go").textContent = "Signing in…";
    try {
      var j = await L.post("/api/auth/login", { email: email, password: pw });
      if (j._status === 429) { L.show(L.wait(j)); }
      else if (j.code === "email_not_verified") {
        L.show("");
        var e = $("msg"); e.className = "msg show err";
        e.innerHTML = "Please confirm your email first. <button type='button' class='link' id='resend'>Send the link again</button>";
        $("resend").onclick = async function () {
          await L.post("/api/auth/resend-verification", { email: email });
          L.show("If that account still needs confirming, we have sent a new link.", "ok");
        };
      } else if (j._status !== 200 || !j.success) { L.show(j.error || "Sign-in failed."); }
      else {
        try { localStorage.setItem("lawcentral_auth", JSON.stringify({ user: j.data.user, token: j.data.token })); }
        catch (x) { L.show("Your browser is blocking storage, so sign-in can't be kept. Allow site data and try again."); return; }
        location.replace(L.back); return;
      }
    } catch (x) { L.show("Could not reach the server. Check your connection and try again."); }
    $("pw").value = ""; $("go").disabled = false; $("go").textContent = "Sign in";
  });
})();
</script>
</body>
</html>
