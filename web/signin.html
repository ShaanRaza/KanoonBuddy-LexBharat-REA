<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Sign in · LexBharat</title>
<style>
  :root { --bg:#fafaf9; --card:#fff; --fg:#1c1917; --mut:#6b6761; --line:#e7e5e4; --acc:#c2571a; --accfg:#fff; --err:#b42318; --errbg:#fef3f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1d1c1b; --fg:#f5f4f2; --mut:#a09b94; --line:#33312f; --acc:#e8742c; --accfg:#1a0f08; --err:#fda29b; --errbg:#2a1412; }
  }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
  main { width:100%; max-width:380px }
  .brand { font:600 26px/1.2 Georgia,"Playfair Display",serif; letter-spacing:.2px; margin:0 0 4px }
  .sub { color:var(--mut); margin:0 0 24px; font-size:15px }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px }
  label { display:block; font-size:14px; font-weight:600; margin:0 0 6px }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--fg); font:inherit; margin-bottom:16px }
  input:focus-visible, button:focus-visible { outline:2px solid var(--acc); outline-offset:2px }
  button { width:100%; padding:12px; border:0; border-radius:9px; background:var(--acc); color:var(--accfg); font:600 16px/1 inherit; cursor:pointer }
  button[disabled] { opacity:.6; cursor:progress }
  #err { display:none; background:var(--errbg); color:var(--err); border-radius:9px; padding:10px 12px; font-size:14px; margin:0 0 16px }
  #err.show { display:block }
  .note { color:var(--mut); font-size:13px; text-align:center; margin:16px 0 0 }
</style>
</head>
<body>
<main>
  <h1 class="brand">LexBharat</h1>
  <p class="sub">Sign in to continue.</p>
  <form id="f" novalidate>
    <div id="err" role="alert" aria-live="polite"></div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
  </form>
  <p class="note">Access is by invitation. Ask your administrator for an account.</p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  // only same-site paths: never redirect to another origin after sign-in
  var back = qs.get("redirect");
  if (!back || back.charAt(0) !== "/" || back.charAt(1) === "/" || back.indexOf("\\") !== -1) back = "/dashboard";
  if (qs.get("expired")) show("Your session ended. Please sign in again.");

  function show(m) { var e = $("err"); e.textContent = m; e.className = m ? "show" : ""; }

  $("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    show("");
    var email = $("email").value.trim(), pw = $("pw").value;
    if (!email || !pw) { show("Enter your email and password."); return; }
    $("go").disabled = true; $("go").textContent = "Signing in…";
    try {
      var r = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: pw }),
      });
      var j = await r.json().catch(function () { return {}; });
      if (r.status === 429) {
        var s = parseInt(r.headers.get("Retry-After") || "0", 10);
        show("Too many attempts. Try again in " + (s > 90 ? Math.ceil(s / 60) + " minutes" : "a minute") + ".");
      } else if (!r.ok || !j.success) {
        show(j.error || "Sign-in failed.");
      } else {
        try { localStorage.setItem("lawcentral_auth", JSON.stringify({ user: j.data.user, token: j.data.token })); }
        catch (e) { show("Your browser is blocking storage, so sign-in can't be kept. Allow site data and try again."); return; }
        location.replace(back);
        return;
      }
    } catch (e) {
      show("Could not reach the server. Check your connection and try again.");
    }
    $("pw").value = "";
    $("go").disabled = false; $("go").textContent = "Sign in";
  });
})();
</script>
</body>
</html>
